name: Feature request
description: Suggest a focused improvement to KAIRO
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Inbox intelligence
        - OSS intelligence
        - Chat and search
        - Gmail actions
        - Desktop
        - Mobile
        - Accessibility and design
        - Developer experience
        - Documentation
        - Other
    validations:
      required: true
