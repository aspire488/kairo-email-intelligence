name: Bug report
description: Report a reproducible problem in KAIRO
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include real email content, personal data, tokens, or credentials. Report security vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "Commit SHA or release tag"
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, browser, Node.js version"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens, email addresses, message bodies, and personal data.
